name: Build & Release (Android & Windows)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. BUILD ANDROID APK (MOBILE)
  # ==========================================
  build-android:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK Asset
        run: cp build/app/outputs/flutter-apk/app-release.apk GS_VIDEO_PLAYER_Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: GS_VIDEO_PLAYER_Android.apk

  # ==========================================
  # 2. BUILD WINDOWS DESKTOP APP (LAPTOP/PC)
  # ==========================================
  build-windows:
    name: Build Windows Laptop/PC App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release Executable
        run: flutter build windows --release

      - name: Compress Windows Release into Zip
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath GS_VIDEO_PLAYER_Windows_x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: GS_VIDEO_PLAYER_Windows_x64.zip

  # ==========================================
  # 3. PUBLISH GITHUB RELEASE (BOTH ASSETS)
  # ==========================================
  publish-release:
    name: Publish Release (Mobile + Laptop)
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-app

      - name: Extract Version Info
        id: version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          VERSION_NAME=$(echo $RAW_VERSION | cut -d '+' -f 1)
          VERSION_CODE=$(echo $RAW_VERSION | cut -d '+' -f 2)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Generate version.json
        run: |
          cat <<EOF > version.json
          {
            "app_id": "com.example.gs_video_player",
            "version_code": ${{ steps.version.outputs.version_code }},
            "version_name": "${{ steps.version.outputs.version_name }}",
            "download_url_android": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/GS_VIDEO_PLAYER_Android.apk",
            "download_url_windows": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/GS_VIDEO_PLAYER_Windows_x64.zip",
            "release_notes": "Official Release ${{ steps.version.outputs.tag }} for Android Mobile & Windows Laptop!",
            "is_force_update": false,
            "updated_at": "$(date -u +'%Y-%m-%d')"
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "GS Video Player ${{ steps.version.outputs.tag }} (Android & Windows)"
          body: |
            ## ?? GS Video Player ${{ steps.version.outputs.tag }} is Live!
            
            Watch movies and videos with high performance on both **Laptop** and **Mobile**!
            
            ### ?? Downloads:
            - ?? **Mobile (Android)**: [GS_VIDEO_PLAYER_Android.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/GS_VIDEO_PLAYER_Android.apk)
            - ?? **Laptop / PC (Windows)**: [GS_VIDEO_PLAYER_Windows_x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/GS_VIDEO_PLAYER_Windows_x64.zip)
          files: |
            GS_VIDEO_PLAYER_Android.apk
            GS_VIDEO_PLAYER_Windows_x64.zip
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
