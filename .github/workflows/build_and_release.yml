name: Build & Release Mobile APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Install Dependencies
        run: flutter pub get

      - name: 5. Extract Version Info
        id: version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          VERSION_NAME=$(echo $RAW_VERSION | cut -d '+' -f 1)
          VERSION_CODE=$(echo $RAW_VERSION | cut -d '+' -f 2)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building version $VERSION_NAME (build $VERSION_CODE)"

      - name: 6. Build Release APK
        run: |
          flutter build apk --release

      - name: 7. Rename Release APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk GS_VIDEO_PLAYER.apk

      - name: 8. Generate version.json for OTA Auto-Updater
        run: |
          cat <<EOF > version.json
          {
            "app_id": "com.example.gs_video_player",
            "version_code": ${{ steps.version.outputs.version_code }},
            "version_name": "${{ steps.version.outputs.version_name }}",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/GS_VIDEO_PLAYER.apk",
            "release_notes": "Official Update ${{ steps.version.outputs.tag }} released automatically via GitHub Actions CI/CD.",
            "is_force_update": false,
            "updated_at": "$(date -u +'%Y-%m-%d')"
          }
          EOF

      - name: 9. Publish GitHub Release with APK & version.json
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "GS Video Player ${{ steps.version.outputs.tag }}"
          body: |
            ## ?? New Release: GS Video Player ${{ steps.version.outputs.tag }}
            
            This release was automatically built and published by **GitHub Actions CI/CD**!
            
            ### ?? Download Links:
            - **[GS_VIDEO_PLAYER.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/GS_VIDEO_PLAYER.apk)**
            
            ### ?? In-App OTA Update:
            Phones with GS Video Player will automatically detect this new version (${{ steps.version.outputs.version_code }}) on launch!
          files: |
            GS_VIDEO_PLAYER.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
