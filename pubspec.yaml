name: gs_video_player
description: "A sleek local video player for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.3.0
  video_player: ^2.9.2
  video_player_win: ^3.3.1
  file_picker: ^8.1.4
  chewie: ^1.8.5
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  dio: ^5.7.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
